name: toolchain-candidate

# Rehearse a release without touching the official transitional tags: build all
# requested targets for amd64 and arm64, prove the amd64 members with the
# capability checks, then promote exactly the tested digests into candidate
# manifests. See docs/toolchain/ci-evidence.md for the evidence contract and the
# capability matrix, and `scripts/verify-promoted-manifest.sh` for the gate.
#
#   gh workflow run toolchain-candidate.yml --ref <branch> \
#     -f targets="core browser" [-f run_e2e=false]
#
# Candidate tags are `<target>-candidate` and `<target>-candidate-<short sha>`.
# The workflow refuses to run on the upstream repository, so a rehearsal can
# never publish to the upstream package.
on:
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated targets to build (slim full core browser)
        required: false
        default: slim full core browser
        type: string
      run_e2e:
        description: Run the TM-12 transitional E2E script when it exists
        required: false
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io

concurrency:
  group: toolchain-candidate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      targets: ${{ steps.parse.outputs.targets }}
      test_matrix: ${{ steps.parse.outputs.test_matrix }}
      short_sha: ${{ steps.parse.outputs.short_sha }}
      image: ${{ steps.parse.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Parse the request
        id: parse
        env:
          REQUESTED: ${{ inputs.targets }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$REPO" in
            dizys/*) echo "candidate rehearsals run in the fork, not upstream" >&2; exit 1 ;;
          esac
          # Checks are capabilities the variant advertises; see the matrix in
          # docs/toolchain/ci-evidence.md. Transitional targets keep their baked
          # fallback, so the harness lifecycle test asserts it, and both kinds
          # of target run the offline check (which asserts the fallback the
          # variant actually ships). Final targets cover the harness lifecycle
          # through TM-12's E2E hook instead.
          capabilities() {
            case "$1" in
              slim|full) echo "infrastructure,mise,ownership,harness,offline,inventory,smoke,measure" ;;
              core|browser) echo "infrastructure,mise,ownership,offline,runtime,inventory,smoke,measure" ;;
            esac
          }
          needs_e2e() {
            case "$1" in core|browser) echo true ;; *) echo false ;; esac
          }
          targets=""
          test_matrix="[]"
          for target in $REQUESTED; do
            case "$target" in
              slim|full|core|browser) ;;
              *) echo "unknown target '$target' (want slim full core browser)" >&2; exit 2 ;;
            esac
            targets="${targets}${targets:+,}$target"
            test_matrix="$(jq -cn \
              --argjson matrix "$test_matrix" --arg target "$target" \
              --arg checks "$(capabilities "$target")" \
              --argjson e2e "$(needs_e2e "$target")" \
              '$matrix + [{target:$target, checks:$checks, e2e:$e2e}]')"
          done
          [ -n "$targets" ] || { echo "no targets requested" >&2; exit 2; }
          matrix_json="$(jq -cn --argjson include "$test_matrix" '{include:$include}')"
          {
            echo "targets=$(jq -cn --arg t "$targets" '$t | split(",")')"
            echo "test_matrix=$matrix_json"
            echo "short_sha=${GITHUB_SHA:0:12}"
            echo "image=$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          } >> "$GITHUB_OUTPUT"
          printf 'Rehearsing %s at %s\n' "$targets" "${GITHUB_SHA:0:12}"
          printf 'test matrix: %s\n' "$matrix_json"

      # Cheap, and they cover modules the capability checks below assemble by
      # hand. Fail here and the builds do not even start.
      - name: Unit tests
        run: node --test tests/*.test.mjs

  build:
    name: build ${{ matrix.target }} (${{ matrix.platform }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.prepare.outputs.targets) }}
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk
        if: matrix.target == 'full' || matrix.target == 'browser'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prepare.outputs.image }}

      # Always pushed by digest: the amd64 member is pulled back and tested as
      # an exact reference, and promotion stitches the digests into the
      # candidate manifest without a rebuild.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ needs.prepare.outputs.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            IMAGE_VERSION=${{ needs.prepare.outputs.short_sha }}
            IMAGE_VARIANT=${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=min,scope=${{ matrix.target }}-${{ matrix.platform }}

      # buildx pushes an index when it attaches provenance, so the digest above
      # refers to the index. The platform manifest is its member, and that is
      # the artifact the capabilitiy checks and the promoted manifest must
      # agree on.
      - name: Resolve the platform digest
        id: platform
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect --raw \
            "${REGISTRY}/${{ needs.prepare.outputs.image }}@${INDEX_DIGEST}")"
          digest="$(printf '%s' "$raw" | jq -r --arg arch "$ARCH" \
            '.manifests[] | select((.platform.os // "") == "linux" and (.platform.architecture // "") == $arch) | .digest' | head -1)"
          [ -n "$digest" ] && [ "$digest" != "null" ] \
            || { echo "no linux/$ARCH member in $INDEX_DIGEST" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Record the built digest
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: linux/${{ matrix.platform }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
        run: |
          mkdir -p /tmp/evidence
          jq -cn \
            --arg target "$TARGET" --arg platform "$PLATFORM" \
            --arg digest "$PLATFORM_DIGEST" --arg indexDigest "$INDEX_DIGEST" \
            --arg ref "${REGISTRY}/${{ needs.prepare.outputs.image }}@${PLATFORM_DIGEST}" \
            --arg indexRef "${REGISTRY}/${{ needs.prepare.outputs.image }}@${INDEX_DIGEST}" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson tested false \
            '{target:$target, platform:$platform, digest:$digest, indexDigest:$indexDigest,
              ref:$ref, indexRef:$indexRef, tested:$tested,
              sourceSha:$sourceSha, runUrl:$runUrl}' \
            > "/tmp/evidence/build-${TARGET}-${{ matrix.platform }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-build-${{ matrix.target }}-${{ matrix.platform }}
          path: /tmp/evidence/*.json
          if-no-files-found: error
          retention-days: 7

  # One job per target on native amd64. Each check is a capability the variant
  # advertises; see the matrix in docs/toolchain/ci-evidence.md. The tested
  # evidence artifact is written only after every step passed, which is what
  # gates promotion.
  test:
    name: test ${{ matrix.target }} (amd64)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      packages: read
    env:
      # Pin freshness is a source-hygiene check, reported separately below; the
      # rehearsal waiver keeps promotion gated on artifact behaviour while the
      # T3 binary-distribution migration is pending (see ci-evidence.md). The
      # release path in build.yml never waives it.
      T3_SMOKE_ALLOW_OUTDATED_PINS: "1"
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.test_matrix) }}
    steps:
      - uses: actions/checkout@v4

      # The full and browser images are several GB; the default runner does not
      # have room for them alongside the measurement save below.
      - name: Reclaim disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: candidate-build-${{ matrix.target }}-amd64
          path: /tmp/build

      - name: Resolve the tested reference
        run: |
          set -euo pipefail
          digest="$(jq -r .digest /tmp/build/build-*.json)"
          ref="${REGISTRY}/${{ needs.prepare.outputs.image }}@${digest}"
          {
            echo "IMAGE_REF=${ref}"
            echo "T3C_IMAGE=${ref}"
            echo "T3C_VARIANT=${{ matrix.target }}"
            echo "T3C_PLATFORM=linux/amd64"
          } >> "$GITHUB_ENV"

      # TM-12 may need the browser candidate next to a core image. It is only
      # advertised when the browser target was part of this rehearsal.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: candidate-build-browser-amd64
          path: /tmp/browser-build

      - name: Advertise the browser candidate (when built)
        run: |
          for f in /tmp/browser-build/build-*.json; do
            [ -e "$f" ] || continue
            echo "T3C_BROWSER_IMAGE=${REGISTRY}/${{ needs.prepare.outputs.image }}@$(jq -r .digest "$f")" >> "$GITHUB_ENV"
          done

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the exact built digest
        run: docker pull "$IMAGE_REF"

      - name: Infrastructure isolation
        if: contains(matrix.checks, 'infrastructure')
        run: scripts/test-infrastructure.sh "$IMAGE_REF"

      - name: Mise toolchain contract
        if: contains(matrix.checks, 'mise')
        run: scripts/test-mise.sh "$IMAGE_REF"

      - name: Ownership migration
        if: contains(matrix.checks, 'ownership')
        run: scripts/test-ownership.sh "$IMAGE_REF"

      - name: Harness lifecycle surfaces
        if: contains(matrix.checks, 'harness')
        run: |
          scripts/test-harness-manager.sh "$IMAGE_REF"
          scripts/test-harness-surfaces.sh "$IMAGE_REF"

      - name: Offline setup status
        if: contains(matrix.checks, 'offline')
        run: scripts/test-offline.sh --variant "${{ matrix.target }}" "$IMAGE_REF"

      - name: Runtime matrix through mise
        if: contains(matrix.checks, 'runtime')
        run: scripts/test-runtime-matrix.sh "$IMAGE_REF"

      - name: Image inventory
        if: contains(matrix.checks, 'inventory')
        run: scripts/test-image-inventory.sh --variant "${{ matrix.target }}" "$IMAGE_REF"

      # Keeps drift visible even though the smoke test below is allowed to
      # proceed while the T3 migration is pending.
      - name: Pinned versions (informational)
        continue-on-error: true
        run: |
          ./scripts/bump-versions.sh --check | tee /tmp/versions.txt
          {
            echo "### Pinned versions: ${{ matrix.target }}"
            echo
            echo '```'
            cat /tmp/versions.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test (exact reference)
        if: contains(matrix.checks, 'smoke')
        run: scripts/smoke-test.sh --variant "${{ matrix.target }}" "$IMAGE_REF"

      # TM-12 owns scripts/test-toolchain-e2e.sh and the report. The hook is
      # inert until that script lands, then every candidate run exercises it.
      - name: Transitional E2E (when the script exists)
        if: ${{ inputs.run_e2e && matrix.e2e && hashFiles('scripts/test-toolchain-e2e.sh') != '' }}
        run: scripts/test-toolchain-e2e.sh --variant "$T3C_VARIANT" "$T3C_IMAGE"

      # Measured from the pulled digest, so the startup timing belongs to the
      # exact artifact under test. The registry-mode measurement (no startup,
      # no local pull) is in ci-evidence.md for pushed references.
      - name: Measure the tested artifact
        if: contains(matrix.checks, 'measure')
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          docker tag "$IMAGE_REF" "t3code:${{ matrix.target }}"
          scripts/measure-image.sh --no-build --json "${{ matrix.target }}" \
            > "/tmp/evidence/measure-${{ matrix.target }}.json"
          jq -r '.[] | "\(.target) \(.arch) compressed=\(.compressed_bytes) unpacked=\(.unpacked_bytes) startup=\(.startup_seconds)s"' \
            "/tmp/evidence/measure-${{ matrix.target }}.json"

      - name: Record the tested digest
        env:
          TARGET: ${{ matrix.target }}
          CHECKS: ${{ matrix.checks }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          digest="$(jq -r .digest /tmp/build/build-*.json)"
          size="$(cat "/tmp/evidence/measure-${TARGET}.json" 2>/dev/null || echo null)"
          if [ "${T3_SMOKE_ALLOW_OUTDATED_PINS:-0}" = "1" ]; then pin="waived"; else pin="asserted"; fi
          jq -cn \
            --arg target "$TARGET" --arg digest "$digest" --arg platform linux/amd64 \
            --arg ref "${REGISTRY}/${{ needs.prepare.outputs.image }}@${digest}" \
            --arg checks "$CHECKS" --arg sourceSha "$GITHUB_SHA" --arg pinFreshness "$pin" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson size "$size" \
            '{target:$target, platform:$platform, digest:$digest, ref:$ref, tested:true,
              checks: ($checks | split(",")), size:$size, pinFreshness:$pinFreshness,
              sourceSha:$sourceSha, runUrl:$runUrl}' \
            > "/tmp/evidence/tested-${TARGET}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-tested-${{ matrix.target }}
          path: /tmp/evidence/tested-*.json
          if-no-files-found: error
          retention-days: 7

  # Assemble the candidate manifest from the digests. The amd64 digest must come
  # from the tested evidence the test jobs wrote, never from the build artifact;
  # the arm64 member is built and digest-mapped but not separately tested.
  promote:
    name: promote candidate manifests
    needs: [prepare, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/evidence
          pattern: candidate-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the tested digests into candidate manifests
        env:
          TARGETS: ${{ needs.prepare.outputs.targets }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
          SLUG: ${{ needs.prepare.outputs.image }}
        run: |
          set -euo pipefail
          evidence=/tmp/evidence
          : > "$evidence/candidate-evidence.ndjson"
          for target in $(jq -r '.[]' <<< "$TARGETS"); do
            amd64="$evidence/tested-${target}.json"
            amd64_build="$evidence/build-${target}-amd64.json"
            arm64="$evidence/build-${target}-arm64.json"
            [ -f "$amd64" ] || { echo "missing tested amd64 evidence for $target" >&2; exit 1; }
            [ -f "$amd64_build" ] || { echo "missing amd64 build evidence for $target" >&2; exit 1; }
            [ -f "$arm64" ] || { echo "missing arm64 evidence for $target" >&2; exit 1; }
            [ "$(jq -r .tested "$amd64")" = "true" ] \
              || { echo "$target amd64 evidence is not marked tested" >&2; exit 1; }
            # The promoted members are the platform manifests the checks ran
            # against. The source refs are the pushed indexes, so provenance
            # stays attached to the candidate.
            amd64_digest="$(jq -r .digest "$amd64")"
            amd64_index="$(jq -r .indexDigest "$amd64_build")"
            arm64_digest="$(jq -r .digest "$arm64")"
            arm64_index="$(jq -r .indexDigest "$arm64")"
            tags=("${REGISTRY}/${SLUG}:${target}-candidate"
                  "${REGISTRY}/${SLUG}:${target}-candidate-${SHORT_SHA}")
            for tag in "${tags[@]}"; do
              case "$tag" in
                *-candidate|*-candidate-*) ;;
                *) echo "refusing to create non-candidate tag $tag" >&2; exit 1 ;;
              esac
            done
            docker buildx imagetools create \
              -t "${tags[0]}" -t "${tags[1]}" \
              "${REGISTRY}/${SLUG}@${amd64_index}" "${REGISTRY}/${SLUG}@${arm64_index}"
            scripts/verify-promoted-manifest.sh \
              --expect "linux/amd64=${amd64_digest}" \
              --expect "linux/arm64=${arm64_digest}" \
              "${tags[0]}"
            # The run-scoped tag is convenient but re-running the workflow at
            # the same commit overwrites it; the index digest is the immutable
            # record retained here.
            manifest_digest="$(docker buildx imagetools inspect "${tags[0]}" \
              --format '{{.Manifest.Digest}}')"
            jq -cn \
              --arg target "$target" \
              --arg manifestRef "${tags[0]}" \
              --arg manifestRefRunScoped "${tags[1]}" \
              --arg manifestDigest "$manifest_digest" \
              --argjson amd64 "$(cat "$amd64")" \
              --argjson arm64 "$(cat "$arm64")" \
              '{target:$target, manifestRef:$manifestRef,
                manifestRefRunScoped:$manifestRefRunScoped, manifestDigest:$manifestDigest,
                members:{amd64:$amd64, arm64:$arm64}, promotion:"tested-digests-only"}' \
              >> "$evidence/candidate-evidence.ndjson"
          done
          jq -s '.' "$evidence/candidate-evidence.ndjson" > "$evidence/candidate-evidence.json"
          {
            echo "### Candidate rehearsal"
            echo
            echo '| Target | Manifest | amd64 digest | amd64 tested | arm64 digest |'
            echo '| --- | --- | --- | --- | --- |'
            jq -r '.[] | "| `\(.target)` | `\(.manifestRef)` | `\(.members.amd64.digest)` | \(.members.amd64.tested) | `\(.members.arm64.digest)` |"' \
              "$evidence/candidate-evidence.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: candidate-evidence
          path: /tmp/evidence/candidate-evidence.json
          if-no-files-found: error
          retention-days: 14
