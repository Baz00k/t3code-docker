name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # A pinned image goes stale the moment upstream ships. Monday morning is soon
  # enough to catch it, and the job only reports - it never rebuilds on its own.
  schedule:
    - cron: "0 6 * * 1"

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse and pass shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          for f in docker/entrypoint.sh docker/bin/* scripts/*.sh scripts/lib/*.sh tests/*.test.sh; do
            bash -n "$f"
            shellcheck -S warning "$f"
          done
          bash tests/image-profile.test.sh
          node --test tests/*.test.mjs
          node scripts/harness-ui-audit.js
          scripts/generate-mise-idiomatic.sh --check
      - name: Compose file is valid
        run: docker compose config >/dev/null

  # Reports drift rather than failing the build: a pin that is one patch behind
  # should not block a merge, but it should be visible in the run.
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pinned versions are current
        id: check
        continue-on-error: true
        run: ./scripts/bump-versions.sh --check | tee /tmp/versions.txt
      - name: Summarise
        run: |
          {
            echo "### Pinned tool versions"
            echo
            echo '```'
            cat /tmp/versions.txt
            echo '```'
            if [ "${{ steps.check.outcome }}" = failure ]; then
              echo
              echo "Run \`./scripts/bump-versions.sh\` to refresh them."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Every target builds for both architectures on its own native runner. Only
  # amd64 is smoke-tested; arm64 members are built and digest-mapped but are not
  # separately smoke-tested (see docs/toolchain/ci-evidence.md).
  #
  # On a release tag both final targets push by digest, and `merge` stitches the
  # tested digests into the release tags. Nothing is rebuilt between test and
  # publish. `latest` becomes `core`; the historical `slim`/`full` tags stop
  # receiving updates and keep their existing artifacts.
  build:
    name: ${{ matrix.target }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: lint
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [core, browser]
        platform: [amd64, arm64]
        include:
          - platform: amd64
            runner: ubuntu-latest
          - platform: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # The browser image is several GB; the default runner does not have room
      # for it alongside the preinstalled toolchains.
      - name: Reclaim disk
        if: matrix.target == 'browser'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Lowercase the image path
        id: image
        run: echo "slug=$(printf '%s' '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.slug }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.platform }}
          # Tag pushes go straight to the registry by digest, so the smoke
          # test and the E2E below pull the exact artifact that would be
          # released. Everything else stays local.
          load: ${{ github.ref_type != 'tag' }}
          outputs: ${{ github.ref_type == 'tag' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, steps.image.outputs.slug) || '' }}
          tags: ${{ github.ref_type != 'tag' && format('t3code:{0}', matrix.target) || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          # The tag on a release build, the branch otherwise; the setup page
          # shows it so a pull can be confirmed at a glance.
          build-args: |
            IMAGE_VERSION=${{ github.ref_type == 'tag' && github.ref_name || format('{0}@{1}', github.ref_name, github.sha) }}
            IMAGE_VARIANT=${{ matrix.target }}
          cache-from: type=gha,scope=${{ matrix.target }}-${{ matrix.platform }}
          cache-to: type=gha,mode=min,scope=${{ matrix.target }}-${{ matrix.platform }}

      # buildx pushes an index when it attaches provenance, so the digest above
      # refers to the index. The platform manifest is its member, and that is
      # the artifact the smoke test, the E2E and the promoted manifest must
      # agree on.
      - name: Resolve the platform digest
        id: platform
        if: github.ref_type == 'tag'
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          raw="$(docker buildx imagetools inspect --raw \
            "${REGISTRY}/${{ steps.image.outputs.slug }}@${INDEX_DIGEST}")"
          digest="$(printf '%s' "$raw" | jq -r --arg arch "$ARCH" \
            '.manifests[] | select((.platform.os // "") == "linux" and (.platform.architecture // "") == $arch) | .digest' | head -1)"
          [ -n "$digest" ] && [ "$digest" != "null" ] \
            || { echo "no linux/$ARCH member in $INDEX_DIGEST" >&2; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Smoke test (native amd64)
        if: matrix.platform == 'amd64'
        env:
          VARIANT: ${{ matrix.target }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            scripts/smoke-test.sh --variant "$VARIANT" \
              "${REGISTRY}/${{ steps.image.outputs.slug }}@${PLATFORM_DIGEST}"
          else
            scripts/smoke-test.sh --variant "$VARIANT" "t3code:${VARIANT}"
          fi

      # The release gate for the assembled product: install and launch all five
      # managed harnesses through T3, survive recreation (including offline),
      # prove project tools stay separate from image infrastructure, and on
      # `browser` drive real pages through the managed MCP registration.
      # Runs against the exact pushed digest on native amd64.
      - name: Final-target E2E (native amd64, release only)
        if: github.ref_type == 'tag' && matrix.platform == 'amd64'
        env:
          VARIANT: ${{ matrix.target }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
        run: |
          scripts/test-toolchain-e2e.sh --variant "$VARIANT" \
            "${REGISTRY}/${{ steps.image.outputs.slug }}@${PLATFORM_DIGEST}"

      # Measured from the pulled digest, so the size and startup timing belong
      # to the exact artifact under test.
      - name: Measure the tested artifact (native amd64, release only)
        if: github.ref_type == 'tag' && matrix.platform == 'amd64'
        env:
          VARIANT: ${{ matrix.target }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence
          docker pull "${REGISTRY}/${{ steps.image.outputs.slug }}@${PLATFORM_DIGEST}" >/dev/null
          docker tag "${REGISTRY}/${{ steps.image.outputs.slug }}@${PLATFORM_DIGEST}" "t3code:${VARIANT}"
          scripts/measure-image.sh --no-build --json "$VARIANT" \
            > "/tmp/evidence/measure-${VARIANT}.json"

      - name: Report artifact size
        if: github.ref_type == 'tag' && matrix.platform == 'amd64'
        env:
          VARIANT: ${{ matrix.target }}
        run: |
          set -euo pipefail
          jq -r '
            .[0] |
            "### Size: `\(.target)`\n\n" +
            "| Artifact | Compressed | Unpacked | Startup |\n| --- | ---: | ---: | ---: |\n" +
            "| `\(.target)` | \(.compressed_bytes) B | \(.unpacked_bytes) B | \(.startup_seconds) s |"' \
            "/tmp/evidence/measure-${VARIANT}.json" >> "$GITHUB_STEP_SUMMARY"

      # The evidence artifact is written only after the smoke test and E2E above
      # passed, and it names the exact platform digest that was tested. `merge`
      # promotes the pushed indexes without rebuilding anything and asserts
      # that their members are these digests.
      - name: Record the tested digest
        if: github.ref_type == 'tag'
        env:
          VARIANT: ${{ matrix.target }}
          PLATFORM: linux/${{ matrix.platform }}
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM_DIGEST: ${{ steps.platform.outputs.digest }}
          TESTED: ${{ matrix.platform == 'amd64' }}
        run: |
          mkdir -p /tmp/evidence
          size="$(cat "/tmp/evidence/measure-${VARIANT}.json" 2>/dev/null || echo null)"
          [ "$TESTED" = "true" ] && size="$(printf '%s' "$size" | jq -c '.[0] // null' 2>/dev/null || echo null)" || size=null
          jq -cn \
            --arg target "$VARIANT" --arg platform "$PLATFORM" \
            --arg digest "$PLATFORM_DIGEST" --arg indexDigest "$INDEX_DIGEST" \
            --arg sourceSha "$GITHUB_SHA" \
            --arg ref "${REGISTRY}/${{ steps.image.outputs.slug }}@${PLATFORM_DIGEST}" \
            --arg indexRef "${REGISTRY}/${{ steps.image.outputs.slug }}@${INDEX_DIGEST}" \
            --arg runUrl "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --argjson tested "$TESTED" \
            --argjson size "$size" \
            '{target:$target, platform:$platform, digest:$digest, indexDigest:$indexDigest,
              ref:$ref, indexRef:$indexRef, tested:$tested, size:$size,
              sourceSha:$sourceSha, runUrl:$runUrl}' \
            > "/tmp/evidence/build-${VARIANT}-${{ matrix.platform }}.json"

      - uses: actions/upload-artifact@v4
        if: github.ref_type == 'tag'
        with:
          name: build-evidence-${{ matrix.target }}-${{ matrix.platform }}
          # The evidence contract is the build record; the measurement file
          # feeds the run summary and its numbers are copied into the record.
          path: /tmp/evidence/build-*.json
          if-no-files-found: error
          retention-days: 7

  # Promote the tested digests into the release tags. No image is rebuilt: the
  # manifest list is assembled from the digests the build jobs pushed, and
  # `verify-promoted-manifest.sh` asserts that each release tag maps exactly the
  # digests the jobs recorded. `core` becomes `latest`; historical `slim`/`full`
  # tags keep their existing artifacts and stop receiving updates.
  merge:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [core, browser]
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the image path
        id: image
        run: echo "slug=$(printf '%s' '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/evidence
          pattern: build-evidence-${{ matrix.target }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.slug }}
          # `flavor: suffix` would apply to every tag, turning the bare `core`
          # tag into `core-core`. Spell each one out instead.
          #   core    -> :core :latest :1.2.3 :1.2 :1.2.3-core :1.2-core
          #   browser -> :browser :1.2.3-browser :1.2-browser
          flavor: latest=false
          tags: |
            type=raw,value=${{ matrix.target }}
            type=semver,pattern={{version}},suffix=-${{ matrix.target }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.target }}
            type=raw,value=latest,enable=${{ matrix.target == 'core' }}
            type=semver,pattern={{version}},enable=${{ matrix.target == 'core' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ matrix.target == 'core' }}

      - name: Promote the tested digests
        env:
          SLUG: ${{ steps.image.outputs.slug }}
        run: |
          set -euo pipefail
          refs=(); expects=(); amd64_tested=0; arm64=0
          # Only the build records; the run's measurement JSON also lands in
          # /tmp/evidence and is a differently shaped document.
          for f in /tmp/evidence/build-*.json; do
            platform="$(jq -r .platform "$f")"
            digest="$(jq -r .digest "$f")"
            index="$(jq -r .indexDigest "$f")"
            case "$platform" in
              linux/amd64) amd64_tested="$(jq -r .tested "$f")" ;;
              linux/arm64) arm64=$((arm64 + 1)) ;;
              *) echo "unexpected platform '$platform' in $f" >&2; exit 1 ;;
            esac
            # Promote the pushed index (provenance included); assert that its
            # platform members are the manifests the smoke test and E2E ran
            # against.
            refs+=("${REGISTRY}/${SLUG}@${index}")
            expects+=(--expect "${platform}=${digest}")
          done
          [ "${#refs[@]}" -eq 2 ] \
            || { echo "expected two platform digests, found ${#refs[@]}" >&2; exit 1; }
          [ "$amd64_tested" = "true" ] \
            || { echo "the amd64 digest is not marked as tested" >&2; exit 1; }
          [ "$arm64" -eq 1 ] || { echo "missing the arm64 digest" >&2; exit 1; }
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          args=(); for tag in "${tags[@]}"; do args+=(-t "$tag"); done
          docker buildx imagetools create "${args[@]}" "${refs[@]}"
          scripts/verify-promoted-manifest.sh "${expects[@]}" "${tags[0]}"
          {
            echo "### Promoted \`${{ matrix.target }}\`"
            echo
            echo '| Platform | Member digest | Tested | Index digest |'
            echo '| --- | --- | --- | --- |'
            jq -r '"| \(.platform) | `\(.digest)` | \(.tested) | `\(.indexDigest)` |"' /tmp/evidence/build-*.json
            echo
            echo "Tags: $(printf "\`%s\` " "${tags[@]}")"
          } >> "$GITHUB_STEP_SUMMARY"
